<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TypeSafe Copy All</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:16px}
button{width:100%;font-size:1.25rem;font-weight:700;padding:18px;border:0;border-radius:14px;background:#111;color:#fff}
#status{margin:10px 0;font-weight:600;min-height:1.3em}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:#f4f4f5;padding:12px;border-radius:12px;max-height:60vh;overflow:auto}
</style></head><body>
<h1 style="font-size:1.15rem">TypeSafe → Claude</h1>
<p>Tap Copy all, then paste into Claude.</p>
<button id="b" type="button">Loading…</button>
<div id="status"></div>
<pre id="doc">Loading docs…</pre>
<script>
const MD_URL = "https://cdn.jsdelivr.net/gh/fugatew205-afk/seasonally-legal@main/typesafe-pack.md";
const b=document.getElementById('b'), s=document.getElementById('status'), d=document.getElementById('doc');
(async()=>{
  try{
    const r=await fetch(MD_URL+"?t="+Date.now());
    if(!r.ok) throw new Error("HTTP "+r.status);
    const t=await r.text();
    d.textContent=t;
    b.textContent="Copy all";
    b.onclick=async()=>{
      try{await navigator.clipboard.writeText(t);s.textContent="Copied. Switch to Claude and paste.";b.textContent="Copied ✓";}
      catch(e){const range=document.createRange();range.selectNodeContents(d);const sel=getSelection();sel.removeAllRanges();sel.addRange(range);s.textContent="Selected — use Copy from the selection menu.";}
    };
  }catch(e){b.textContent="Failed to load";s.textContent=String(e);}}
)();
</script>
</body></html>
